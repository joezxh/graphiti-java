# ============================================================
# OntoGraph 开发/测试环境 docker-compose
# ============================================================
# 使用方式:
#   docker-compose up -d          # 后台启动所有服务
#   docker-compose up             # 前台运行，Ctrl+C 停止
#   docker-compose down           # 停止并移除容器
#   docker-compose logs -f        # 查看日志
#   docker-compose restart         # 重启服务
# ============================================================

services:
  # -------------------------------------------
  # ontograph-java 应用 (8080)
  # -------------------------------------------
  ontograph-java:
    container_name: ontograph-java
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8081:8080"
    environment:
      # Profile 激活
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      # 数据源 (PostgreSQL)
      - SPRING_DATASOURCE_DYNAMIC_PRIMARY=master
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://postgres:5432/graphiti?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # Redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # Neo4j (外部服务)
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      # LLM Provider (通过环境变量或 .env 文件配置)
      # Spring AI 配置 (根据选择的 Provider 生效)
      - SPRING_AI_MODEL_CHAT=${SPRING_AI_MODEL_CHAT:-openai}
      - SPRING_AI_MODEL_EMBEDDING=${SPRING_AI_MODEL_EMBEDDING:-openai}
      - SPRING_AI_OPENAI_API_KEY=${SPRING_AI_OPENAI_API_KEY:-}
      - SPRING_AI_OPENAI_BASE_URL=${SPRING_AI_OPENAI_BASE_URL:-}
      - SPRING_AI_OLLAMA_BASE_URL=${SPRING_AI_OLLAMA_BASE_URL:-}
      - SPRING_AI_ANTHROPIC_API_KEY=${SPRING_AI_ANTHROPIC_API_KEY:-}
      - SPRING_AI_MISTRALAI_API_KEY=${SPRING_AI_MISTRALAI_API_KEY:-}
      # Graphiti AI Provider 选择；必须与 SPRING_AI_MODEL_* 对齐。
      - GRAPHITI_AI_LLM_PROVIDER=${GRAPHITI_AI_LLM_PROVIDER:-openai}
      - GRAPHITI_AI_EMBEDDING_PROVIDER=${GRAPHITI_AI_EMBEDDING_PROVIDER:-openai}
      - GRAPHITI_AI_RERANK_PROVIDER=${GRAPHITI_AI_RERANK_PROVIDER:-custom}
      # JWT
      - ONTOGRAPH_SECURITY_JWT_SECRET=${JWT_SECRET:-mySecretKeyForJWTTokenGenerationWhichShouldBeAtLeast512BitsLong}
      - ONTOGRAPH_SECURITY_JWT_EXPIRATION=${JWT_EXPIRATION:-86400}
      # 日志级别
      - LOGGING_LEVEL_ROOT=${LOGGING_LEVEL_ROOT:-INFO}
      - LOGGING_LEVEL_COM_ONTOGRAPH=${LOGGING_LEVEL_COM_ONTOGRAPH:-DEBUG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ontograph-network

  # -------------------------------------------
  # PostgreSQL (5432)
  # -------------------------------------------
  postgres:
    container_name: ontograph-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=graphiti
    ports:
      - "5433:5432"
    volumes:
      # 持久化数据到宿主机
      - ./data/postgres:/var/lib/postgresql/data
      # 初始化脚本（仅在首次创建数据库时执行）
      - ./sql/postgresql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/postgresql/init-data.sql:/docker-entrypoint-initdb.d/02-init-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d graphiti"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ontograph-network

  # -------------------------------------------
  # Redis (6379)
  # -------------------------------------------
  redis:
    container_name: ontograph-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      # 持久化数据到宿主机
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ontograph-network

# -------------------------------------------
# 网络
# -------------------------------------------
networks:
  ontograph-network:
    driver: bridge
