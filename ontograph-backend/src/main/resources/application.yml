# OntoGraph 知识图谱后端服务配置文件
server:
  port: 9090
# 应用配置
spring:
  application:
    name: ontograph-java
  profiles:
    active: dev



# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: true
      logic-not-delete-value: false

# Spring AI 配置（根据 Provider 选择配置）
# OpenAI: spring.ai.openai.api-key + spring.ai.openai.base-url
# Qwen:   spring.ai.openai.api-key + spring.ai.openai.base-url (指向 dashscope)
# Ollama: spring.ai.ollama.base-url

# JWT 配置
ontograph:
  security:
    jwt:
      secret: mySecretKeyForJWTTokenGenerationWhichShouldBeAtLeast512BitsLong
      expiration: 86400  # 24 hours
  ai:
    llm-provider: openai
    embedding-provider: openai

# 日志配置
logging:
  level:
    com.ontograph: debug
    org.springframework.security: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Spring Boot Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: health, metrics, info
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: false

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
