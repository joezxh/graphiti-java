# OntoGraph API Tester - 配置文件
# 环境变量优先级高于此配置文件

# ============================================================
# 目标服务配置
# ============================================================
server:
  # 目标服务基础URL
  base-url: http://localhost:8080
  # API文档路径（用于自动发现端点）
  api-docs-path: /v3/api-docs
  # Swagger UI路径
  swagger-ui-path: /swagger-ui.html

# ============================================================
# 认证配置
# ============================================================
auth:
  # 登录接口路径
  login-path: /api/v1/auth/login
  # 登录用户名（可通过环境变量覆盖）
  username: admin
  # 登录密码（可通过环境变量覆盖）
  password: admin123
  # Bearer Token 前缀
  bearer-prefix: "Bearer "
  # Token刷新阈值（秒），当剩余有效期低于此值时自动刷新
  refresh-threshold-seconds: 300

# ============================================================
# HTTP客户端配置
# ============================================================
http:
  # 连接超时（毫秒）
  connect-timeout-ms: 30000
  # 读取超时（毫秒）
  read-timeout-ms: 60000
  # 请求超时（毫秒）
  request-timeout-ms: 120000
  # 最大连接数
  max-total-connections: 50
  # 每路由最大连接数
  max-per-route-connections: 10
  # 重试次数
  retry-count: 3
  # 重试间隔（毫秒）
  retry-interval-ms: 1000
  # 可重试的HTTP方法
  retryable-methods:
    - GET
    - POST
    - PUT
    - DELETE

# ============================================================
# 测试执行配置
# ============================================================
test:
  # 是否启用端点自动发现（从OpenAPI规范）
  auto-discover-enabled: true
  # 是否启用手动注册的端点测试
  manual-endpoints-enabled: true
  # 并发线程数（0=串行执行）
  concurrency: 0
  # 测试执行前等待时间（秒）
  startup-delay-seconds: 5
  # 是否在测试后自动清理
  auto-cleanup: true
  # 清理失败是否继续
  cleanup-fail-continue: true
  # 测试数据唯一标识前缀
  test-data-prefix: "api_test_"
  # 最大响应体记录长度
  max-response-body-length: 4096

# ============================================================
# 报告配置
# ============================================================
report:
  # 控制台输出
  console:
    # 是否启用彩色输出
    colored: true
    # 是否显示详细错误信息
    show-stack-trace: true
    # 是否显示请求/响应详情
    show-request-response: false
    # 进度条刷新间隔（毫秒）
    progress-refresh-ms: 500
  # Markdown报告
  markdown:
    # 是否生成Markdown报告
    enabled: true
    # 输出路径（相对于报告目录）
    output-path: api-test-report.md
  # HTML报告
  html:
    # 是否生成HTML报告
    enabled: true
    # 输出路径（相对于报告目录）
    output-path: api-test-report.html
  # 报告输出根目录
  output-directory: ./test-reports

# ============================================================
# 模块过滤（选择性执行）
# ============================================================
modules:
  # 认证模块
  auth: true
  # 图谱管理模块
  graph: true
  # 节点管理模块
  node: true
  # 边管理模块
  edge: true
  # 剧集管理模块
  episode: true
  # 搜索模块
  search: true
  # 搜索管道模块
  search-pipeline: true
  # 数据导入模块
  data-import: true
  # 本体管理模块
  ontology: true
  # 提示管理模块
  prompt: true
  # 法律图谱模块
  legal: true
  # 业务信息模块
  business-info: true
  # 系统管理模块
  system: false

# ============================================================
# 测试场景配置
# ============================================================
scenarios:
  # 端到端CRUD流程测试
  crud-flow:
    enabled: true
    # 每个资源类型创建的测试数据数量
    data-count: 2
  # 认证流程测试
  auth-flow:
    enabled: true
  # 搜索功能测试
  search-flow:
    enabled: true
    # 搜索关键词列表
    keywords:
      - "测试"
      - "知识图谱"
      - "entity"
  # 导入功能测试
  import-flow:
    enabled: false
