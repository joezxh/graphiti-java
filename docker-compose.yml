# ============================================================
# Graphiti-Java 开发/测试环境 docker-compose
# ============================================================
# 使用方式:
#   docker-compose up -d          # 后台启动所有服务
#   docker-compose up             # 前台运行，Ctrl+C 停止
#   docker-compose down           # 停止并移除容器
#   docker-compose logs -f        # 查看日志
#   docker-compose restart         # 重启服务
# ============================================================

services:
  # -------------------------------------------
  # graphiti-java 应用 (8080)
  # -------------------------------------------
  graphiti-java:
    container_name: graphiti-java
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Profile 激活
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      # 数据源 (PostgreSQL)
      - SPRING_DATASOURCE_DYNAMIC_PRIMARY=master
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_URL=jdbc:postgresql://postgres:5432/graphiti?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_DYNAMIC_DATASOURCE_MASTER_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      # Redis
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # Neo4j (外部服务)
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USERNAME=${NEO4J_USERNAME:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password123}
      # LLM Provider (通过环境变量或 .env 文件配置)
      # Spring AI 配置 (根据选择的 Provider 生效)
      - SPRING_AI_OPENAI_API-KEY=${SPRING_AI_OPENAI_API-KEY:-}
      - SPRING_AI_OPENAI_BASE-URL=${SPRING_AI_OPENAI_BASE-URL:-}
      - SPRING_AI_OLLAMA_BASE-URL=${SPRING_AI_OLLAMA_BASE-URL:-}
      - SPRING_AI_AZURE_OPENAI_API-KEY=${SPRING_AI_AZURE_OPENAI_API-KEY:-}
      - SPRING_AI_AZURE_OPENAI_ENDPOINT=${SPRING_AI_AZURE_OPENAI_ENDPOINT:-}
      # Graphiti AI Provider 选择
      - GRAPHTI_AI_LLM_PROVIDER=${GRAPHTI_AI_LLM_PROVIDER:-openai}
      - GRAPHTI_AI_EMBEDDING_PROVIDER=${GRAPHTI_AI_EMBEDDING_PROVIDER:-openai}
      - GRAPHTI_AI_RERANK_PROVIDER=${GRAPHTI_AI_RERANK_PROVIDER:-custom}
      # JWT
      - GRAPHTI_SECURITY_JWT_SECRET=${JWT_SECRET:-mySecretKeyForJWTTokenGenerationWhichShouldBeAtLeast512BitsLong}
      - GRAPHTI_SECURITY_JWT_EXPIRATION=${JWT_EXPIRATION:-86400}
      # 日志级别
      - LOGGING_LEVEL_ROOT=${LOGGING_LEVEL_ROOT:-INFO}
      - LOGGING_LEVEL_COM_GRAPHTI=${LOGGING_LEVEL_COM_GRAPHTI:-DEBUG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - graphiti-network

  # -------------------------------------------
  # PostgreSQL (5432)
  # -------------------------------------------
  postgres:
    container_name: graphiti-postgres
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=graphiti
    ports:
      - "5432:5432"
    volumes:
      # 持久化数据到宿主机
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d graphiti"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphiti-network

  # -------------------------------------------
  # Redis (6379)
  # -------------------------------------------
  redis:
    container_name: graphiti-redis
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      # 持久化数据到宿主机
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - graphiti-network

# -------------------------------------------
# 网络
# -------------------------------------------
networks:
  graphiti-network:
    driver: bridge
