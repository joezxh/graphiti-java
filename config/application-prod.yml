# ============================================================
# OntoGraph 知识图谱后端服务 - 生产环境配置
# ============================================================
#
# 【重要】此文件通过 docker-compose 挂载到容器内 /app/config/
# 或通过外部配置中心 / Spring Cloud Config 加载
#
# ============================================================

spring:
  application:
    name: ontograph-java

  # 数据源 (通过环境变量覆盖)
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/graphiti?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
          username: ${SPRING_DATASOURCE_USERNAME:postgres}
          password: ${SPRING_DATASOURCE_PASSWORD:postgres}
          driver-class-name: org.postgresql.Driver
          hikari:
            maximum-pool-size: 20
            minimum-idle: 5
            connection-timeout: 30000
            idle-timeout: 600000
            max-lifetime: 1800000
            connection-test-query: SELECT 1

  # Redis (通过环境变量覆盖)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000

  # Web
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/
    # SPA 路由 fallback，所有未匹配路径回退到 index.html
  mvc:
    throw-exception-if-no-handler-found: false
    static-path-pattern: /**
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # Jackson 序列化配置
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

# MyBatis-Plus 生产配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

# Spring AI 配置 (通过环境变量覆盖)
# 默认使用 OpenAI，需要在 .env 中配置 SPRING_AI_OPENAI_API_KEY
ai:
  openai:
    api-key: ${SPRING_AI_OPENAI_API_KEY:}
    base-url: ${SPRING_AI_OPENAI_BASE_URL:}
    chat:
      options:
        model: ${SPRING_AI_OPENAI_CHAT_MODEL:gpt-4o}
        temperature: ${SPRING_AI_OPENAI_TEMPERATURE:0.2}
    embedding:
      options:
        model: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        dimensions: ${SPRING_AI_OPENAI_EMBEDDING_DIMENSIONS:1536}

# OntoGraph AI Provider 选择配置
ontograph:
  ai:
    # LLM 提供商: openai | qwen | ollama | anthropic | mistral | deepseek | groq | fireworks | nebius | hyperbolic | siliconflow
    llm-provider: ${GRAPHTI_AI_LLM_PROVIDER:openai}
    embedding-provider: ${GRAPHTI_AI_EMBEDDING_PROVIDER:openai}
    rerank-provider: ${GRAPHTI_AI_RERANK_PROVIDER:custom}

    # 各 Provider 详细配置 (通过环境变量覆盖)
    openai:
      model: ${GRAPHTI_AI_OPENAI_MODEL:gpt-4o}
      base-url: ${GRAPHTI_AI_OPENAI_BASE_URL:https://api.openai.com/v1}
      temperature: ${GRAPHTI_AI_OPENAI_TEMPERATURE:0.2}
      max-tokens: ${GRAPHTI_AI_OPENAI_MAX_TOKENS:2048}
      embedding-model: ${GRAPHTI_AI_OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    qwen:
      model: ${GRAPHTI_AI_QWEN_MODEL:qwen-turbo}
      base-url: ${GRAPHTI_AI_QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      temperature: 0.2
      max-tokens: 2048
      embedding-model: ${GRAPHTI_AI_QWEN_EMBEDDING_MODEL:text-embedding-v2}
    ollama:
      chat-model: ${GRAPHTI_AI_OLLAMA_CHAT_MODEL:llama3.2}
      embedding-model: ${GRAPHTI_AI_OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      base-url: ${GRAPHTI_AI_OLLAMA_BASE_URL:http://localhost:11434}
      temperature: 0.2
    anthropic:
      model: ${GRAPHTI_AI_ANTHROPIC_MODEL:claude-sonnet-4-20250514}
      temperature: 0.2
      max-tokens: 4096
    mistral:
      model: ${GRAPHTI_AI_MISTRAL_MODEL:mistral-small-latest}
      temperature: 0.2
      embedding-model: mistral-embed
    deepseek:
      model: ${GRAPHTI_AI_DEEPSEEK_MODEL:deepseek-chat}
      base-url: ${GRAPHTI_AI_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      temperature: 0.2
      max-tokens: 2048
      embedding-model: deepseek-embed
    groq:
      model: ${GRAPHTI_AI_GROQ_MODEL:llama-3.1-70b-versatile}
      base-url: ${GRAPHTI_AI_GROQ_BASE_URL:https://api.groq.com/openai/v1}
      temperature: 0.2
      max-tokens: 2048
      embedding-model: embedding-english-large-v2
    fireworks:
      model: ${GRAPHTI_AI_FIREWORKS_MODEL:accounts/fireworks/models/llama-v3p1-8b-instruct}
      base-url: ${GRAPHTI_AI_FIREWORKS_BASE_URL:https://api.fireworks.ai/v1}
      temperature: 0.2
      max-tokens: 2048
      embedding-model: accounts/fireworks/models/nomic-embed-text-v1.5
    nebius:
      model: ${GRAPHTI_AI_NEBIUS_MODEL:meta-llama/Meta-Llama-3.1-8B-Instruct}
      base-url: ${GRAPHTI_AI_NEBIUS_BASE_URL:https://api.nebius.ai/v1}
      temperature: 0.2
      max-tokens: 2048
      embedding-model: intfloat/e5-mistral-7b-retrieval
    hyperbolic:
      model: ${GRAPHTI_AI_HYPERBOLIC_MODEL:meta-llama/Llama-3.1-70B-Instruct}
      base-url: ${GRAPHTI_AI_HYPERBOLIC_BASE_URL:https://api.hyperbolic.ai/v1}
      temperature: 0.2
      max-tokens: 2048
      embedding-model: BAAI/bge-m3
    siliconflow:
      model: Qwen/Qwen2.5-7B-Instruct
      base-url: ${GRAPHTI_AI_SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      temperature: 0.2
      max-tokens: 2048
      embedding-model: BAAI/bge-m3
      rerank-model: BAAI/bge-reranker-base

  security:
    jwt:
      secret: ${GRAPHTI_SECURITY_JWT_SECRET:PleaseChangeThisSecretInProductionEnvironmentMin512Bits}
      expiration: ${GRAPHTI_SECURITY_JWT_EXPIRATION:86400}

# Neo4j 配置 (通过环境变量覆盖)
neo4j:
  uri: ${NEO4J_URI:bolt://neo4j:7687}
  username: ${NEO4J_USERNAME:neo4j}
  password: ${NEO4J_PASSWORD:password123}

# Actuator 生产配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true

# 日志配置 (生产使用 logback-prod.xml)
logging:
  config: classpath:logback-prod.xml
  level:
    root: INFO
    com.ontograph: INFO
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.neo4j.driver: WARN
