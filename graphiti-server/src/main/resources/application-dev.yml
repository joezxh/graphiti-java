  # ============================================================
  # 【当前使用的配置】
  # ============================================================
  # 请根据实际情况取消注释上方的配置模板

  # OpenAI 兼容配置 (本地 LM Studio)
  ai:
    openai:
      api-key: sk-lm-sbY78sMA:Nzdd8WQMcbOzuuufmvLy
      base-url: http://localhost:1234
      # Chat 配置
      chat:
        options:
          model: google/gemma-4-e4b
          temperature: 0.2
      # Embedding 配置
      # 注意: LM Studio 的 embedding 模型需要在 "Embedding" 模式下加载，不能用 reranker 模型
      # 推荐模型: nomic-embed-text, bge-m3, all-MiniLM-L6-v2 等
      embedding:
        options:
          model: text-embedding-qwen3-embedding-0.6b
      rerank:
        options:
          model: text-embedding-bge-reranker-v2-m3

  # 数据源配置
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:postgresql://localhost:5432/graphiti?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: postgres
          password: postgres@2026!
          driver-class-name: org.postgresql.Driver
          hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: 6379

# Graphiti AI Provider 选择配置
graphiti:
  ai:
    # LLM 提供商: openai | qwen | ollama | anthropic | mistral | deepseek | groq | fireworks | nebius | hyperbolic
    llm-provider: openai
    # Embedding 提供商: openai | qwen | ollama | mistral | deepseek | voyage | fireworks | nebius | hyperbolic | together
    embedding-provider: openai
    # Rerank 提供商: openai | custom
    rerank-provider: custom

    # 各 Provider 详细配置 (与 spring.ai 配置对应)
    openai:
      model: google/gemma-4-e4b
      base-url: http://127.0.0.1:1234/v1
      temperature: 0.2
      max-tokens: 2048
      embedding-model: text-embedding-qwen3-embedding-0.6b
    qwen:
      model: qwen-turbo
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      temperature: 0.2
      max-tokens: 2048
      embedding-model: text-embedding-v2
    ollama:
      chat-model: google/gemma-4-e4b
      embedding-model: text-embedding-bge-reranker-v2-m3
      base-url: http://localhost:11434
      temperature: 0.2
    anthropic:
      model: claude-sonnet-4-20250514
      temperature: 0.2
      max-tokens: 2048
    mistral:
      model: mistral-small-latest
      temperature: 0.2
      embedding-model: mistral-embed
    deepseek:
      model: deepseek-chat
      base-url: https://api.deepseek.com
      temperature: 0.2
      max-tokens: 2048
      embedding-model: deepseek-embed
    groq:
      model: llama-3.1-70b-versatile
      base-url: https://api.groq.com/openai/v1
      temperature: 0.2
      max-tokens: 2048
      embedding-model: embedding-english-large-v2
    fireworks:
      model: accounts/fireworks/models/llama-v3p1-8b-instruct
      base-url: https://api.fireworks.ai/v1
      temperature: 0.2
      max-tokens: 2048
      embedding-model: accounts/fireworks/models/nomic-embed-text-v1.5
    nebius:
      model: meta-llama/Meta-Llama-3.1-8B-Instruct
      base-url: https://api.nebius.ai/v1
      temperature: 0.2
      max-tokens: 2048
      embedding-model: intfloat/e5-mistral-7b-retrieval
    hyperbolic:
      model: meta-llama/Llama-3.1-70B-Instruct
      base-url: https://api.hyperbolic.ai/v1
      temperature: 0.2
      max-tokens: 2048
      embedding-model: BAAI/bge-m3
    together:
      model: meta-llama/Llama-3.1-8B-Instruct
      base-url: https://api.together.xyz/v1
      temperature: 0.2
      max-tokens: 2048
      embedding-model: thenlper/gte-Qwen2-7B-instruct
    siliconflow:
      model: Qwen/Qwen2.5-7B-Instruct
      base-url: https://api.siliconflow.cn/v1
      temperature: 0.2
      max-tokens: 2048
      embedding-model: BAAI/bge-m3
      rerank-model: BAAI/bge-reranker-base
    voyage:
      model: gpt-4o
      base-url: https://api.voyageai.com/v1
      temperature: 0.2
      max-tokens: 2048
      embedding-model: voyage-3-lite

# Neo4j 配置
neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: password123

# ============================================================
# 【开发环境专用配置】
# ============================================================
# 此文件用于本地开发，包含:
# - 本地数据库连接 (localhost)
# - 详细日志 (DEBUG)
# - 开发工具 (Swagger, H2 console 等)
# ============================================================

spring:
  # 开发模式详细日志
  autoconfigure:
    exclude:
      # 按需排除不需要的自动配置

# Actuator 开发配置 (允许所有信息)
management:
  endpoints:
    web:
      exposure:
        include: "*"  # 开发时暴露所有端点
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    db:
      enabled: true
    redis:
      enabled: true

# 日志配置 (开发详细日志)
logging:
  level:
    com.graphiti: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot: DEBUG

# Web 静态资源配置 (开发时 Vite 代理)
spring:
  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/,file:src/main/resources/static/,file:graphiti-web/dist/
  mvc:
    static-path-pattern: /**
  servlet:
    # 静态资源映射
    resources:
      static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:src/main/resources/static/,file:graphiti-web/dist/

# 数据源配置
datasource:
  dynamic:
    primary: master
    strict: false
    datasource:
      master:
        url: jdbc:postgresql://localhost:5432/graphiti?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
        username: postgres
        password: postgres@2026!
        driver-class-name: org.postgresql.Driver
        hikari:
          maximum-pool-size: 10
          minimum-idle: 5
          connection-timeout: 30000

data:
  redis:
    host: localhost
    port: 6379
