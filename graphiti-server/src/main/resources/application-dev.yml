  # 支持多种开源模型
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${NOVITA_API_KEY:sk-xxxxx}
  #     base-url: https://api.novita.ai/v3
  #     chat:
  #       options:
