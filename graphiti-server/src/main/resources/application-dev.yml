# 开发环境配置
# ============================================================
# Spring AI 私有化部署接入配置
# ============================================================
# 所有 Provider 均支持自定义 base-url 接入私有化部署模型
#
# 【OpenAI 兼容模型】vLLM / LM Studio / LocalAI / Xinference
#   spring.ai.openai.api-key: any-key
#   spring.ai.openai.base-url: http://localhost:8000/v1
#
# 【Anthropic 兼容模型】LiteLLM 代理 / 私有化 Claude 网关
#   spring.ai.anthropic.api-key: any-key
#   spring.ai.anthropic.base-url: http://localhost:8080/v1
#
# 【Ollama 本地模型】
#   spring.ai.ollama.base-url: http://localhost:11434
#
# 【Qwen 通义千问】OpenAI 兼容 API
#   spring.ai.openai.api-key: sk-your-dashscope-key
#   spring.ai.openai.base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
# ============================================================
spring:
  ai:
    openai:
      api-key: sk-lm-sbY78sMA:Nzdd8WQMcbOzuuufmvLy
      base-url: http://127.0.0.1:1234/v1
  # 数据源配置
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:postgresql://localhost:5432/graphiti?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          username: postgres
          password: postgres@2026!
          driver-class-name: org.postgresql.Driver
          hikari:
            maximum-pool-size: 10
            minimum-idle: 5
            connection-timeout: 30000
  
  data:
    redis:
      host: localhost
      port: 6379

# Spring AI 配置（OpenAI / Ollama 自动配置读取）
# spring.ai.openai.api-key: ${OPENAI_API_KEY:}
# spring.ai.openai.base-url: https://api.openai.com/v1
# spring.ai.openai.chat.options.model: gpt-4o
# spring.ai.openai.chat.options.temperature: 0.2
# spring.ai.ollama.base-url: http://localhost:11434
# spring.ai.ollama.chat.options.model: llama3

# Graphiti AI Provider 选择配置
graphiti:
  ai:
    llm-provider: openai  # openai | qwen | ollama | anthropic
    embedding-provider: openai  # openai | qwen | ollama | anthropic
    openai:
      model: google/gemma-4-e4b
      base-url: http://127.0.0.1:1234/v1
      temperature: 0.2
      max-tokens: 2048
    qwen:
      model: qwen-turbo
      temperature: 0.2
      max-tokens: 2048
    ollama:
      chat-model: llama3
      embedding-model: nomic-embed-text
      temperature: 0.2
    anthropic:
      model: claude-3-sonnet-20240229
      temperature: 0.2
      max-tokens: 2048

# Neo4j 配置
neo4j:
  uri: bolt://localhost:7687
  username: neo4j
  password: password123

# 日志配置
logging:
  level:
    com.graphiti: DEBUG
    org.springframework.security: DEBUG
