# ============================================================
# Graphiti 知识图谱后端服务 - 开发环境配置
# ============================================================
#
# 【Spring AI Embedding/Rerank 模型配置】
# 本配置文件提供所有支持的 Provider 的完整配置模板
# 实际使用时请取消注释并填入对应配置
#
# ============================================================

spring:
  # ----------------------------------------------------------
  # 【OpenAI】Embedding + Rerank + Chat
  # ----------------------------------------------------------
  # 官方 API: https://api.openai.com/v1
  # Embedding 模型: text-embedding-3-small, text-embedding-3-large, text-embedding-ada-002
  # Rerank 模型: rerank (需开通权限)
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${OPENAI_API_KEY:sk-xxxxx}
  #     base-url: https://api.openai.com/v1  # 官方地址
  #     # base-url: https://dashscope.aliyuncs.com/compatible-mode/v1  # 通义千问 OpenAI 兼容地址
  #     # base-url: http://localhost:8000/v1  # vLLM / LM Studio / LocalAI / Xinference 私有化地址
  #     chat:
  #       options:
  #         model: gpt-4o
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: text-embedding-3-small
  #         # model: text-embedding-3-large  # 更高精度，1536 维度
  #         # model: text-embedding-ada-002  # 最小，1536 维度
  #         # dimensions: 1024  # 仅 text-embedding-3-large/small 支持自定义维度

  # ----------------------------------------------------------
  # 【Azure OpenAI】Embedding + Chat
  # ----------------------------------------------------------
  # API: https://{resource}.openai.azure.com
  # Embedding 模型: text-embedding-3-large, text-embedding-3-small, text-embedding-ada-002
  # ----------------------------------------------------------
  # ai:
  #   azure:
  #     openai:
  #       api-key: ${AZURE_OPENAI_API_KEY:your-api-key}
  #       endpoint: https://{resource}.openai.azure.com
  #       # deployment-id: gpt-4o  # Chat 模型部署名
  #       embedding:
  #         deployment-id: text-embedding-3-small
  #         dimensions: 1536

  # ----------------------------------------------------------
  # 【Ollama】本地 Embedding + Chat
  # ----------------------------------------------------------
  # 本地运行: ollama serve
  # Embedding 模型: nomic-embed-text, mxbai-embed-large, all-minilm
  # 安装 embedding 模型: ollama pull nomic-embed-text
  # ----------------------------------------------------------
  # ai:
  #   ollama:
  #     base-url: http://localhost:11434
  #     chat:
  #       options:
  #         model: llama3.2  # Chat 模型
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: nomic-embed-text  # Embedding 模型

  # ----------------------------------------------------------
  # 【通义千问 (Qwen)】Embedding + Chat
  # ----------------------------------------------------------
  # API: https://dashscope.aliyuncs.com/compatible-mode/v1
  # Embedding 模型: text-embedding-v2, text-embedding-v3 (1024 维度)
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${DASHSCOPE_API_KEY:sk-xxxxx}
  #     base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #     chat:
  #       options:
  #         model: qwen-turbo  # 或 qwen-plus, qwen-max
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: text-embedding-v2  # 阿里云 embedding 模型

  # ----------------------------------------------------------
  # 【Anthropic Claude】Chat Only
  # ----------------------------------------------------------
  # Claude 官方不支持 embedding/rerank，需配合其他服务使用
  # 可使用 OpenAI/Cohere 的 embedding 服务
  # ----------------------------------------------------------
  # ai:
  #   anthropic:
  #     api-key: ${ANTHROPIC_API_KEY:sk-ant-xxxxx}
  #     chat:
  #       options:
  #         model: claude-sonnet-4-20250514
  #         # model: claude-3-5-sonnet-latest
  #         temperature: 0.2
  #         max-tokens: 4096

  # ----------------------------------------------------------
  # 【Google Gemini】Embedding + Chat (通过 OpenAI 兼容模式)
  # ----------------------------------------------------------
  # API: https://generativelanguage.googleapis.com
  # Embedding 模型: models/text-embedding-004, models/embedding-001
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${GEMINI_API_KEY:your-gemini-api-key}
  #     base-url: https://generativelanguage.googleapis.com/v1beta/openai/
  #     chat:
  #       options:
  #         model: gemini-2.0-flash
  #         # model: gemini-1.5-flash
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: text-embedding-004

  # ----------------------------------------------------------
  # 【Cohere】Embedding + Rerank (通过 OpenAI 兼容模式)
  # ----------------------------------------------------------
  # API: https://api.cohere.ai
  # Embedding 模型: embed-english-v3.0, embed-multilingual-v3.0
  # Rerank 模型: rerank-english-v3.0, rerank-multilingual-v3.0
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${COHERE_API_KEY:your-cohere-api-key}
  #     base-url: https://api.cohere.ai/v1
  #     embedding:
  #       options:
  #         model: embed-multilingual-v3.0  # 多语言 embedding
  #         input-type: search_document  # search_document | search_query

  # ----------------------------------------------------------
  # 【Mistral AI】Embedding + Chat
  # ----------------------------------------------------------
  # API: https://api.mistral.ai
  # Embedding 模型: mistral-embed
  # ----------------------------------------------------------
  # ai:
  #   mistral:
  #     api-key: ${MISTRAL_API_KEY:your-mistral-api-key}
  #     # base-url: https://api.mistral.ai  # 默认官方地址
  #     chat:
  #       options:
  #         model: mistral-small-latest
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: mistral-embed

  # ----------------------------------------------------------
  # 【vLLM】Embedding + Chat (OpenAI 兼容)
  # ----------------------------------------------------------
  # 本地运行: vllm serve ... --task embedding
  # Embedding 模型: 支持任何 vLLM 支持的 embedding 模型
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: any-key  # vLLM 不验证 API key
  #     base-url: http://localhost:8000/v1
  #     chat:
  #       options:
  #         model: meta-llama/Llama-3.1-8B-Instruct
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: your-embedding-model-name  # 与 vLLM 部署名一致

  # ----------------------------------------------------------
  # 【LocalAI】Embedding + Chat (OpenAI 兼容)
  # ----------------------------------------------------------
  # 本地运行: localai run ...
  # Embedding 模型: nomic-embed-text, bge-*, all-MiniLM-*
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: any-key  # LocalAI 不验证 API key
  #     base-url: http://localhost:8080/v1
  #     chat:
  #       options:
  #         model: llama-3.2
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: nomic-embed-text

  # ----------------------------------------------------------
  # 【Xinference】Embedding + Rerank + Chat (OpenAI 兼容)
  # ----------------------------------------------------------
  # 本地运行: xinference
  # Web UI: http://localhost:9997
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: any-key
  #     base-url: http://localhost:8090/v1  # Xinference 默认端口
  #     chat:
  #       options:
  #         model: qwen2.5-7b-instruct
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: your-embedding-model-uid  # Xinference 模型 UID

  # ----------------------------------------------------------
  # 【LM Studio】Embedding + Chat (OpenAI 兼容)
  # ----------------------------------------------------------
  # 本地运行: lmstudio
  # Web UI: http://localhost:1234
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: any-key
  #     base-url: http://localhost:1234/v1
  #     chat:
  #       options:
  #         model: llama-3.2-3b-instruct
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: nomic-embed-text  # 需先下载并加载 embedding 模型

  # ----------------------------------------------------------
  # 【DeepSeek】Embedding + Chat
  # ----------------------------------------------------------
  # API: https://api.deepseek.com
  # Embedding 模型: deepseek-embed (1536 维度)
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${DEEPSEEK_API_KEY:sk-xxxxx}
  #     base-url: https://api.deepseek.com
  #     chat:
  #       options:
  #         model: deepseek-chat
  #         # model: deepseek-coder
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: deepseek-embed

  # ----------------------------------------------------------
  # 【Groq】Embedding + Chat
  # ----------------------------------------------------------
  # API: https://api.groq.com
  # Embedding 模型: embedding-english-large-v2, embedding-english-light-v2
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${GROQ_API_KEY:gsk_xxxxx}
  #     base-url: https://api.groq.com/openai/v1
  #     chat:
  #       options:
  #         model: llama-3.1-70b-versatile
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: embedding-english-large-v2

  # ----------------------------------------------------------
  # 【Bedrock (AWS)】Embedding + Chat
  # ----------------------------------------------------------
  # 需要 AWS credentials 配置
  # ----------------------------------------------------------
  # ai:
  #   bedrock:
  #     aws:
  #       region: us-east-1
  #       access-key: ${AWS_ACCESS_KEY_ID:}
  #       secret-key: ${AWS_SECRET_ACCESS_KEY:}
  #     chat:
  #       options:
  #         model: anthropic.claude-3-5-sonnet-20241022-v1:0
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: amazon.titan-embed-text-v2:0

  # ----------------------------------------------------------
  # 【SiliconFlow】Embedding + Rerank (聚合 API)
  # ----------------------------------------------------------
  # API: https://api.siliconflow.cn/v1
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${SILICONFLOW_API_KEY:sk-xxxxx}
  #     base-url: https://api.siliconflow.cn/v1
  #     chat:
  #       options:
  #         model: Qwen/Qwen2.5-7B-Instruct
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: BAAI/bge-m3
  #     rerank:
  #       options:
  #         model: BAAI/bge-reranker-base

  # ----------------------------------------------------------
  # 【Voyage AI】Embedding (通过 OpenAI 兼容模式)
  # ----------------------------------------------------------
  # API: https://api.voyageai.com
  # Embedding 模型: voyage-3-lite, voyage-3, voyage-code-2
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${VOYAGE_API_KEY:voyage-xxxxx}
  #     base-url: https://api.voyageai.com/v1
  #     chat:
  #       options:
  #         model: gpt-4o
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: voyage-3-lite
  #         # model: voyage-3  # 更高精度
  #         # model: voyage-code-2  # 代码 embedding

  # ----------------------------------------------------------
  # 【HuggingFace】Embedding + Chat
  # ----------------------------------------------------------
  # API: https://api-inference.huggingface.co
  # Embedding 模型: BAAI/bge-m3, intfloat/e5-mistral-7b-retrieval
  # Chat 模型: meta-llama/Llama-3.1-8B-Instruct
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${HF_API_KEY:hf_xxxxx}
  #     base-url: https://api-inference.huggingface.co/v1
  #     chat:
  #       options:
  #         model: meta-llama/Llama-3.1-8B-Instruct
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: BAAI/bge-m3

  # ----------------------------------------------------------
  # 【Together AI】Embedding + Chat
  # ----------------------------------------------------------
  # API: https://api.together.xyz
  # Embedding 模型: thenlper/gte-Qwen2-7B-instruct, ...
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${TOGETHER_API_KEY:xxxxx}
  #     base-url: https://api.together.xyz/v1
  #     chat:
  #       options:
  #         model: meta-llama/Llama-3.1-8B-Instruct
  #         temperature: 0.2
  #     embedding:
  #       options:
  #         model: thenlper/gte-Qwen2-7B-instruct

  # ----------------------------------------------------------
  # 【Replicate】Embedding + Chat
  # ----------------------------------------------------------
  # API: https://api.replicate.com
  # ----------------------------------------------------------
  # ai:
  #   openai:
  #     api-key: ${REPLICATE_API_KEY:r8_xxxxx}
  #     base-url: https://api.replicate.com/v1
  #     chat:
  #       options:
  #         model: meta/llama-3.1-8b-instruct
