# Graphiti AI Provider 选择配置
graphiti:
  ai:
    llm-provider: openai  # openai | qwen | ollama
    embedding-provider: openai  # openai | qwen | ollama
    openai:
      model: gpt-4o
      temperature: 0.2
      max-tokens: 2048
    qwen:
      model: qwen-turbo
      temperature: 0.2
      max-tokens: 2048
    ollama:
      chat-model: llama3
      embedding-model: nomic-embed-text
      temperature: 0.2

# Neo4j 配置
